name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref
      - run: agentskills validate skills/setup-digia-engage
      - run: scripts/check-checklist-drift.sh
        env:
          GH_TOKEN: ${{ secrets.DOCS_READ_TOKEN }}
